name: Python (uv)

on:
  push:
    branches: [main, master]
    paths:
      - "apps/api/**"
      - "apps/cron/**"
      - "libs/models/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/cron/**"
      - "libs/models/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python.yml"

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: dns-api
            path: apps/api/tests
          - name: dns-cron
            path: apps/cron/tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Sync dependencies
        run: uv sync --package ${{ matrix.package.name }} --group dev --frozen

      - name: Run tests (${{ matrix.package.name }})
        run: uv run --package ${{ matrix.package.name }} pytest ${{ matrix.package.path }} -q
